<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tsinani Mazahua</title>

    <link rel="stylesheet" href="Estilos/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="login-body">

    <main class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Crear una Cuenta</h1>
                <p>Únete a la plataforma Tsinani Mazahua</p>
            </div>

            <form id="registrationForm" action="#">
                <div class="input-group">
                    <label for="nombreCompleto"><i class="fa-solid fa-user"></i> Nombre Completo</label>
                    <input type="text" id="nombreCompleto" name="nombre" required>
                </div>

                <div class="input-group">
                    <label for="emailRegistro"><i class="fa-solid fa-envelope"></i> Correo Electrónico</label>
                    <input type="email" id="emailRegistro" name="email" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="passwordRegistro"><i class="fa-solid fa-lock"></i> Crear Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="passwordRegistro" name="password" required autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword"><i class="fa-solid fa-check-double"></i> Confirmar Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                </div>

                <p id="errorRegistro" class="error-message"></p>
                <button type="submit" class="btn-ingresar">Registrarse</button>

                <div class="login-link">
                    <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
                </div>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
    </body>
</html>
